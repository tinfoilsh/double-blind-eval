name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    name: Harness and client tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - name: Test
        run: uv run pytest -q
      - name: CLI smoke test
        run: uv run python tests/smoke_cli.py
      - name: Check the entrypoint parses
        run: bash -n entrypoint.sh && test -x entrypoint.sh
