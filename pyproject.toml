[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "double-blind-eval"
version = "0.1.0"
description = "Double-blind model evaluation on Tinfoil Containers: harness, party CLI, notebooks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "cryptography>=42",
]

[project.optional-dependencies]
harness = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.scripts]
dbe = "dbe.cli:main"

[dependency-groups]
dev = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pyyaml>=6",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "nbformat>=5",
]
notebooks = [
    "jupyter>=1.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools]
packages = ["dbe", "harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
